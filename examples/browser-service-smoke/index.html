<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>wLLM browser service smoke test</title>
  </head>
  <body>
    <output id="status">connecting</output>
    <canvas id="ui-workload" width="960" height="540"></canvas>
    <script type="module">
      import { BrowserLLMClient } from '/esm/index.js';
      import { createUiWorkload } from './ui-workload.js';

      const params = new URL(location.href).searchParams;
      const modulePath = params.get('module');
      const wasmPath = params.get('wasm') ?? '/src/single-thread/wllama.wasm';
      const runtimeAssets = modulePath
        ? { moduleCode: await (await fetch(modulePath)).text() }
        : {};
      const client = new BrowserLLMClient(
        {
          'single-thread/wllama.wasm': wasmPath,
        },
        {
          preferWebGPU: params.get('gpu') === '1',
          engineChatSchedulingPolicy:
            params.get('scheduler') ?? 'foreground-aware',
          engineChatSliceTokenBudget: Number(params.get('slice') ?? 4),
          engineChatBackgroundSliceTokenBudget: Number(
            params.get('backgroundSlice') ?? 1
          ),
          engineChatForegroundHandoffGraceMs: Number(
            params.get('handoffGrace') ?? 16
          ),
          engineChatForegroundSliceTokenBudget: Number(
            params.get('foregroundSlice') ?? params.get('slice') ?? 4
          ),
          engineChatYieldEnabled: params.get('yield') !== 'false',
          engineChatEventLoopYieldEnabled:
            params.get('eventLoopYield') !== 'false',
          engineChatForegroundInterruptEnabled:
            params.get('foregroundInterrupt') !== 'false',
          engineChatQueueMaxPending: Number(
            params.get('queueMaxPending') ?? 128
          ),
          engineChatPrefillSliceMaxMs: Number(
            params.get('prefillSliceMaxMs') ?? 5000
          ),
          engineChatWaitBudgetScale: Number(params.get('waitBudgetScale') ?? 1),
          engineChatWaitBudgetCapMs: params.has('waitBudgetCapMs')
            ? Number(params.get('waitBudgetCapMs'))
            : undefined,
          engineChatCostWarmupRequests: Number(
            params.get('costWarmupRequests') ?? 20
          ),
          engineChatCostSampleWindow: Number(
            params.get('costSampleWindow') ?? 256
          ),
          engineChatEvictionHintTopK: Number(
            params.get('evictionHintTopK') ?? 64
          ),
          engineChatRetentionPolicy:
            params.get('retention') ?? 'lifecycle-aware',
          engineChatRetentionTtlMs: Number(params.get('retentionTtl') ?? 30000),
          engineChatTraceEnabled: true,
          suppressNativeLog: params.get('nativeLog') !== '1',
        },
        runtimeAssets
      );
      window.wllmBrowserClient = client;
      window.wllmExperimentEvents = [];
      window.wllmClearExperimentEvents = () => {
        window.wllmExperimentEvents = [];
      };
      client.onTelemetry((event) => {
        window.wllmExperimentEvents.push(event);
      });
      window.wllmMeasureInteraction = async () => {
        const startedAt = performance.now();
        void client.recordEvent('input_dispatch', {
          clientTimestampMs: startedAt,
          clientWallTimeMs: performance.timeOrigin + startedAt,
        });
        return await new Promise((resolve) => {
          requestAnimationFrame(() => {
            requestAnimationFrame(async () => {
              const latencyMs = performance.now() - startedAt;
              await client.recordEvent('next_paint', { latencyMs });
              resolve(latencyMs);
            });
          });
        });
      };
      const uiCanvas = document.querySelector('#ui-workload');
      const uiWorkload = await createUiWorkload(uiCanvas, (type, data) =>
        client.recordEvent(type, data)
      );
      window.wllmStartUiMeasurement = (workItems = 0) =>
        uiWorkload.start(workItems, params.get('gpu') === '1');
      window.wllmStopUiMeasurement = () => uiWorkload.stop();
      window.wllmBrowserReady = client.connect().then(async () => {
        if (params.has('foreground')) {
          await client.updateLifecycle({
            foreground: params.get('foreground') === '1',
            lifecycleState:
              params.get('foreground') === '1' ? 'active' : 'hidden',
          });
        } else {
          await client.updateLifecycle();
        }
        const status = await client.status();
        document.querySelector('#status').textContent = JSON.stringify(status);
        return status;
      });
    </script>
  </body>
</html>
